
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IUBAT Films & Photography — 1st Anniversary</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9933a;
    --gold-light: #f0c060;
    --dark: #0a0a0a;
    --deep: #111008;
  }

  body {
    background: var(--deep);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Lato', sans-serif;
    color: #e8d9b0;
    padding: 2rem 1rem;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(180,100,10,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(200,140,20,0.06) 0%, transparent 60%);
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeDown 0.8s ease both;
  }

  header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    font-weight: 600;
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, #c9933a, #f0c060, #c9933a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.4rem;
  }

  header p {
    font-size: 0.85rem;
    color: rgba(232,217,176,0.5);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .app-container {
    display: flex;
    gap: 2.5rem;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 1100px;
  }

  /* ── Left panel: controls ── */
  .controls {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,147,58,0.2);
    border-radius: 16px;
    padding: 2rem;
    width: 320px;
    flex-shrink: 0;
    animation: fadeUp 0.8s ease 0.2s both;
  }

  .controls h2 {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    color: var(--gold-light);
    margin-bottom: 1.6rem;
    padding-bottom: 0.8rem;
    border-bottom: 1px solid rgba(201,147,58,0.25);
  }

  .field {
    margin-bottom: 1.4rem;
  }

  label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(232,217,176,0.55);
    margin-bottom: 0.5rem;
  }

  input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(201,147,58,0.25);
    border-radius: 8px;
    padding: 0.7rem 1rem;
    color: #e8d9b0;
    font-family: 'Lato', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus {
    border-color: var(--gold);
    background: rgba(255,255,255,0.07);
  }

  .upload-area {
    border: 2px dashed rgba(201,147,58,0.3);
    border-radius: 12px;
    padding: 1.8rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .upload-area:hover {
    border-color: var(--gold);
    background: rgba(201,147,58,0.04);
  }

  .upload-area.has-photo {
    border-style: solid;
    border-color: var(--gold);
    padding: 0.6rem;
  }

  .upload-area input[type="file"] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .upload-icon {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    opacity: 0.6;
  }

  .upload-text {
    font-size: 0.8rem;
    color: rgba(232,217,176,0.5);
    line-height: 1.5;
  }

  #preview-thumb {
    width: 100%;
    border-radius: 8px;
    display: none;
    object-fit: cover;
    max-height: 160px;
  }

  .generate-btn {
    width: 100%;
    background: linear-gradient(135deg, #b07828, #d4a940, #b07828);
    color: #1a1000;
    border: none;
    border-radius: 10px;
    padding: 0.9rem;
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }

  .generate-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .generate-btn:active { transform: translateY(0); }
  .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .download-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    border-radius: 10px;
    padding: 0.8rem;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    margin-top: 0.7rem;
    display: none;
  }

  .download-btn:hover {
    background: rgba(201,147,58,0.1);
    color: #fff;
  }

  /* name position control */
  .name-position {
    margin-top: 1rem;
  }

  .name-position label {
    margin-bottom: 0.4rem;
  }

  select {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(201,147,58,0.25);
    border-radius: 8px;
    padding: 0.6rem 1rem;
    color: #e8d9b0;
    font-family: 'Lato', sans-serif;
    font-size: 0.9rem;
    outline: none;
    cursor: pointer;
  }

  select option { background: #1a1500; }

  /* ── Right panel: canvas preview ── */
  .preview-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    animation: fadeUp 0.8s ease 0.35s both;
  }

  .canvas-wrapper {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(201,147,58,0.15), 0 0 0 1px rgba(201,147,58,0.1);
  }

  canvas {
    display: block;
    max-width: min(500px, 90vw);
    height: auto;
  }

  .placeholder-msg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    background: rgba(10,8,2,0.7);
    font-family: 'Cinzel', serif;
    color: rgba(201,147,58,0.5);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    pointer-events: none;
    transition: opacity 0.4s;
  }

  .placeholder-msg .big-icon { font-size: 2.5rem; opacity: 0.4; }

  @keyframes fadeDown {
    from { opacity:0; transform: translateY(-20px); }
    to   { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }

  @media (max-width: 700px) {
    .controls { width: 100%; max-width: 500px; }
  }
</style>
</head>
<body>

<header>
  <h1>IUBAT Films &amp; Photography</h1>
  <p>1st Anniversary — Attendee Frame Generator</p>
</header>

<div class="app-container">

  <!-- Controls -->
  <div class="controls">
    <h2>✦ Customize Your Frame</h2>

    <div class="field">
      <label>Your Name</label>
      <input type="text" id="nameInput" placeholder="Enter your full name" maxlength="40">
    </div>

    <div class="field">
      <label>Your Photo</label>
      <div class="upload-area" id="uploadArea">
        <input type="file" id="photoInput" accept="image/*">
        <div id="uploadPrompt">
          <div class="upload-icon">📷</div>
          <div class="upload-text">Click or drag &amp; drop your photo<br><small>JPG, PNG, WEBP supported</small></div>
        </div>
        <img id="preview-thumb" alt="Preview">
      </div>
    </div>
<!--
    <div class="field name-position">
      <label>Name Position</label>
      <select id="namePos">
        <option value="below">Below Photo Circle</option>
        <option value="bottom">Bottom of Frame</option>
      </select>
    </div> -->

    <button class="generate-btn" id="generateBtn" disabled>Generate My Frame</button>
    <button class="download-btn" id="downloadBtn">⬇ Download Image</button>
  </div>

  <!-- Preview -->
  <div class="preview-panel">
    <div class="canvas-wrapper">
      <canvas id="frameCanvas" width="2000" height="2500"></canvas>
      <div class="placeholder-msg" id="placeholderMsg">
        <div class="big-icon">🖼</div>
        <div>Upload your photo &amp; generate</div>
      </div>
    </div>
  </div>

</div>

// Circle parameters (in original 2000×2500 px)
const CIRCLE_CX = 1001;
const CIRCLE_CY = 580;
const CIRCLE_R  = 370;  // slightly inside the gold ring

const canvas  = document.getElementById('frameCanvas');
const ctx     = canvas.getContext('2d');
const nameInput  = document.getElementById('nameInput');
const photoInput = document.getElementById('photoInput');
const generateBtn= document.getElementById('generateBtn');
const downloadBtn= document.getElementById('downloadBtn');
const placeholderMsg = document.getElementById('placeholderMsg');
const previewThumb   = document.getElementById('preview-thumb');
const uploadArea     = document.getElementById('uploadArea');
const uploadPrompt   = document.getElementById('uploadPrompt');

let frameImg  = null;
let userPhoto = null;

// Load frame image
const img = new Image();
img.onload = () => { frameImg = img; drawFrameOnly(); };
img.src = FRAME_B64;

function drawFrameOnly() {
  ctx.clearRect(0, 0, 2000, 2500);
  ctx.drawImage(frameImg, 0, 0, 2000, 2500);
}

// Photo upload
photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const photo = new Image();
    photo.onload = () => {
      userPhoto = photo;
      generateBtn.disabled = false;
      // show thumbnail
      previewThumb.src = ev.target.result;
      previewThumb.style.display = 'block';
      uploadPrompt.style.display = 'none';
      uploadArea.classList.add('has-photo');
    };
    photo.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// Name input live update (if frame already generated)
nameInput.addEventListener('input', () => {
  if (userPhoto && frameImg) renderFrame();
});

document.getElementById('namePos').addEventListener('change', () => {
  if (userPhoto && frameImg) renderFrame();
});

generateBtn.addEventListener('click', renderFrame);

function renderFrame() {
  if (!frameImg || !userPhoto) return;

  const W = 2000, H = 2500;
  ctx.clearRect(0, 0, W, H);

  // 1. Draw user photo clipped to circle
  ctx.save();
  ctx.beginPath();
  ctx.arc(CIRCLE_CX, CIRCLE_CY, CIRCLE_R, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();

  // Cover-fit photo in circle
  const pr = CIRCLE_R;
  const pw = userPhoto.naturalWidth;
  const ph = userPhoto.naturalHeight;
  const scale = Math.max((pr*2) / pw, (pr*2) / ph);
  const sw = pw * scale;
  const sh = ph * scale;
  ctx.drawImage(
    userPhoto,
    CIRCLE_CX - sw/2,
    CIRCLE_CY - sh/2,
    sw, sh
  );
  ctx.restore();

  // 2. Draw frame on top (destination-over = behind existing pixels)
  ctx.globalCompositeOperation = 'destination-over';
  ctx.drawImage(frameImg, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // 3. Draw name text
  const name = nameInput.value.trim();
  if (name) {
    const namePos = document.getElementById('namePos').value;
    let textY = namePos === 'below' ? CIRCLE_CY + CIRCLE_R + 160 : 2430;
    
    ctx.save();
    ctx.font = 'bold 100px Cinzel, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.shadowColor = 'rgba(255,255,255,0.6)';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(name, W/2, textY);
    ctx.restore();
  }

  // Hide placeholder
  placeholderMsg.style.opacity = '0';
  downloadBtn.style.display = 'block';
  
  // Scale canvas display
  canvas.style.width  = Math.min(500, window.innerWidth * 0.9) + 'px';
}

downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'iubat-anniversary-frame.jpg';
  link.href = canvas.toDataURL('image/jpeg', 0.92);
  link.click();
});

// Drag & drop
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#f0c060'; });
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; });
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.style.borderColor = '';
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    photoInput.files = e.dataTransfer.files;
    photoInput.dispatchEvent(new Event('change'));
  }
});
</script>
</body>
</html>
