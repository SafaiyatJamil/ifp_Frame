
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IUBAT Frame Generator</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#000;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      color:white;
    }

    .container{
      width:100%;
      max-width:420px;
      background:#111;
      border-radius:24px;
      padding:20px;
      box-shadow:0 0 30px rgba(255,165,0,.25);
    }

    h1{
      text-align:center;
      margin-bottom:10px;
      font-size:28px;
    }

    p{
      text-align:center;
      color:#bbb;
      margin-bottom:20px;
      font-size:14px;
    }

    input{
      width:100%;
      padding:14px;
      margin-bottom:15px;
      border:none;
      border-radius:12px;
      background:#222;
      color:white;
      font-size:16px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:orange;
      color:black;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      margin-top:15px;
    }

    button:hover{
      background:#ffd27a;
    }

    .preview{
      position:relative;
      width:100%;
      aspect-ratio:4/5;
      overflow:hidden;
      border-radius:20px;
      margin-top:20px;
      background:black;
    }

    .frame{
      width:100%;
      height:100%;
      object-fit:cover;
      position:absolute;
      inset:0;
      z-index:2;
    }

    .profile{
      position:absolute;
      width:38%;
      aspect-ratio:1/1;
      border-radius:50%;
      overflow:hidden;
      top:8%;
      left:50%;
      transform:translateX(-50%);
      z-index:1;
      border:4px solid #f7c65f;
      background:#444;
    }

    .profile img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .username{
      position:absolute;
      top:41%;
      left:50%;
      transform:translateX(-50%);
      z-index:3;
      width:90%;
      text-align:center;
      font-size:22px;
      font-weight:bold;
      text-transform:uppercase;
      color:white;
      text-shadow:0 0 10px rgba(0,0,0,.8);
    }

    canvas{
      display:none;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>IUBAT Frame Generator</h1>
  <p>Upload your photo and generate your anniversary card</p>

  <input type="file" id="imageInput" accept="image/*"/>
  <input type="text" id="nameInput" placeholder="Enter your name"/>

  <div class="preview">
    <div class="profile">
      <img id="profileImage" src="https://placehold.co/400"/>
    </div>

    <div class="username" id="previewName">
      YOUR NAME HERE
    </div>

    <img src="frame.png" class="frame" id="frameImage"/>
  </div>

  <button onclick="downloadImage()">Download Image</button>

  <canvas id="canvas" width="1080" height="1350"></canvas>
</div>

<script>
const imageInput = document.getElementById('imageInput');
const profileImage = document.getElementById('profileImage');
const nameInput = document.getElementById('nameInput');
const previewName = document.getElementById('previewName');

imageInput.addEventListener('change', function(e){
  const file = e.target.files[0];

  if(file){
    const reader = new FileReader();

    reader.onload = function(event){
      profileImage.src = event.target.result;
    }

    reader.readAsDataURL(file);
  }
});

nameInput.addEventListener('input', function(){
  previewName.innerText = this.value || 'YOUR NAME HERE';
});

function downloadImage(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const frame = document.getElementById('frameImage');
  const profile = document.getElementById('profileImage');

  canvas.width = 1080;
  canvas.height = 1350;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.beginPath();
  ctx.arc(540,220,170,0,Math.PI*2);
  ctx.closePath();
  ctx.clip();

  ctx.drawImage(profile,370,50,340,340);
  ctx.restore();

  ctx.font = 'bold 55px Arial';
  ctx.fillStyle = 'white';
  ctx.textAlign = 'center';
  ctx.fillText(previewName.innerText.toUpperCase(),540,570);

  ctx.drawImage(frame,0,0,1080,1350);

  const link = document.createElement('a');
  link.download = 'iubat-frame.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>

</body>
</html>
