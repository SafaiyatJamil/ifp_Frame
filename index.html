

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frame Generator</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:430px;
background:#111;
padding:20px;
border-radius:24px;
}

h1{
text-align:center;
margin-bottom:10px;
}

p{
text-align:center;
color:#aaa;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
margin-bottom:14px;
background:#222;
color:#fff;
}

.preview{
position:relative;
width:100%;
aspect-ratio:4/5;
overflow:hidden;
border-radius:20px;
background:#000;
}

.profile{
position:absolute;
top:8%;
left:50%;
transform:translateX(-50%);
width:38%;
aspect-ratio:1/1;
border-radius:50%;
overflow:hidden;
border:4px solid #f7c65f;
z-index:1;
background:#444;
}

.profile img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.frame{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:2;
}

.username{
position:absolute;
top:41%;
left:50%;
transform:translateX(-50%);
width:90%;
text-align:center;
font-size:22px;
font-weight:bold;
z-index:3;
}

.control{
margin-top:10px;
}

label{
font-size:14px;
color:#bbb;
display:block;
margin-bottom:6px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:orange;
color:black;
font-weight:bold;
font-size:18px;
margin-top:18px;
cursor:pointer;
}

canvas{
display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>IUBAT Frame Generator</h1>
<p>Upload photo, reposition and download</p>

<input type="file" id="imageInput" accept="image/*">
<input type="text" id="nameInput" placeholder="Enter your name">

<div class="preview">

<div class="profile">
<img id="profileImage" src="https://placehold.co/600">
</div>

<div class="username" id="previewName">
YOUR NAME HERE
</div>

<img src="frame.png" class="frame" id="frameImage">

</div>

<div class="control">
<label>Zoom</label>
<input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
</div>

<div class="control">
<label>Move Left / Right (X)</label>
<input type="range" id="xSlider" min="-150" max="150" step="1" value="0">
</div>

<div class="control">
<label>Move Up / Down (Y)</label>
<input type="range" id="ySlider" min="-150" max="150" step="1" value="0">
</div>

<button onclick="downloadImage()">Download Image</button>

<canvas id="canvas" width="1080" height="1350"></canvas>

</div>

<script>

const imageInput = document.getElementById('imageInput');
const profileImage = document.getElementById('profileImage');
const nameInput = document.getElementById('nameInput');
const previewName = document.getElementById('previewName');

const zoomSlider = document.getElementById('zoomSlider');
const xSlider = document.getElementById('xSlider');
const ySlider = document.getElementById('ySlider');

let scale = 1;
let posX = 0;
let posY = 0;

imageInput.addEventListener('change', function(e){

const file = e.target.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(event){
profileImage.src = event.target.result;
}

reader.readAsDataURL(file);

}

});

nameInput.addEventListener('input', function(){
previewName.innerText = this.value || 'YOUR NAME HERE';
});

zoomSlider.addEventListener('input', function(){
scale = parseFloat(this.value);
updateImage();
});

xSlider.addEventListener('input', function(){
posX = parseInt(this.value);
updateImage();
});

ySlider.addEventListener('input', function(){
posY = parseInt(this.value);
updateImage();
});

function updateImage(){

profileImage.style.transform =
`translate(${posX}px, ${posY}px) scale(${scale})`;

}

function downloadImage(){

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const frame = document.getElementById('frameImage');

canvas.width = 1080;
canvas.height = 1350;

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.save();

ctx.beginPath();
ctx.arc(540,220,170,0,Math.PI*2);
ctx.closePath();
ctx.clip();

const drawSize = 340 * scale;

ctx.drawImage(
profileImage,
370 + (posX * 2),
50 + (posY * 2),
drawSize,
drawSize
);

ctx.restore();

ctx.font = 'bold 55px Arial';
ctx.fillStyle = 'white';
ctx.textAlign = 'center';
ctx.fillText(previewName.innerText.toUpperCase(),540,570);

ctx.drawImage(frame,0,0,1080,1350);

const link = document.createElement('a');
link.download = 'iubat-frame.png';
link.href = canvas.toDataURL('image/png');
link.click();

}

</script>

</body>
</html>
